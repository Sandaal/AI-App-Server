      - Windows: install/windows.md
      - macOS: install/macos.md
      - Linux: install/linux.md
      - Docker: install/docker.md
      - Kubernetes (Helm): install/kubernetes.md
      - Azure: install/azure.md
      - Offline servers: install/offline.md
      - Model providers: install/models.md
      - Upgrade and uninstall: install/upgrade.md
  - Build apps:
      - build/index.md
      - Your first app: build/first-app.md
      - Example apps: build/examples.md
      - The ten blueprints: build/blueprints.md
      - Customize a blueprint's code: build/customize-blueprints.md
      - The ai-app.yaml file: build/manifest.md
      - Documents and connectors: build/documents.md
      - Python handlers: build/handlers.md
      - Storage, memory and search: build/storage.md
      - Agents, tools and MCP: build/agents.md
      - Workflows and approvals: build/workflows.md
      - Jobs, schedules and events: build/jobs-events.md
      - Guardrails: build/guardrails.md
      - Pages and web components: build/web.md
