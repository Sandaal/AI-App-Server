apiVersion: v1
kind: Pod
metadata:
  name: {{ include "aiapp.fullname" . }}-test-health
  labels: {{- include "aiapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: ["health", "--url", "http://{{ include "aiapp.fullname" . }}:{{ .Values.service.port }}/health"]
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
