# azd template: AI App Server on AKS with the Helm chart.
#   azd up
# Provisions AKS and a registry, builds the image (server plus ./apps) in the
# registry, and installs deploy/helm/aiapp-server with data on an Azure Disk.
name: aiapp-server-aks
metadata:
  template: aiapp-server-aks@0.1.0
hooks:
  postprovision:
    posix: { shell: sh, run: ./scripts/deploy.sh }
    windows: { shell: pwsh, run: ./scripts/deploy.ps1 }
