<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #2f6feb; --ok: #1a7f37; --error: #b42318; --chip: #eef1f4; --drop: #eef4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8d96a0; --border: #30363d;
      --accent: #4c8dff; --ok: #3fb950; --error: #ff7b72; --chip: #21262d; --drop: #132339;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; color: var(--muted); }
  #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 28px 16px; text-align: center; background: var(--panel); cursor: pointer; }
  #drop.over { border-color: var(--accent); background: var(--drop); }
  #drop strong { color: var(--accent); }
  details { margin: 12px 0 0; }
  textarea { width: 100%; min-height: 110px; margin-top: 8px; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
  button { margin-top: 8px; border: 0; border-radius: 8px; padding: 8px 16px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .card { margin-top: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
  .state { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .state.done { color: var(--ok); } .state.dead, .state.error { color: var(--error); }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--muted); font-weight: 600; width: 28%; }
  td.ev { color: var(--muted); font-size: 13px; width: 34%; }
  .err { color: var(--error); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--chip); padding: 8px; border-radius: 8px; font-size: 13px; margin: 0; }
  @media (max-width: 560px) { td.ev { display: block; width: auto; border-top: 0; padding-top: 0; } }
  input, select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .row > * { flex: 1 1 160px; }
  .draft { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--chip); border-radius: 8px; padding: 10px; margin: 8px 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title">Content</h1>
  <p class="sub">Write a brief. The assistant drafts the piece and sends it for review; reviewers approve or ask for changes on the <a href="_approvals/">approvals page</a>.</p>
  <textarea id="brief" placeholder="What should we write? Key points, facts to include, call to action…" aria-label="Brief"></textarea>
  <div class="row">
    <select id="kind" aria-label="Kind"><option value="blog">blog post</option><option value="email">email</option>
      <option value="social">social posts</option><option value="product">product description</option><option value="other">other</option></select>
    <input id="audience" placeholder="Audience (optional)" aria-label="Audience">
    <input id="tone" placeholder="Tone (optional)" aria-label="Tone">
    <input id="words" type="number" min="50" max="3000" value="400" aria-label="Words">
  </div>
  <button id="go" type="button">Draft it</button>
  <div id="results"></div>
</main>
<script>
(() => {
  "use strict";
  const app = location.pathname.split("/")[2] || "app";
  const $ = (id) => document.getElementById(id);
  document.title = $("title").textContent = app;
  const store = {
    get(k) { try { return localStorage.getItem(app + ":" + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(app + ":" + k, v); } catch {} },
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  async function call(url, opts = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers);
    const key = store.get("key");
    if (key) headers["Authorization"] = "Bearer " + key;
    const resp = await fetch(url, Object.assign({}, opts, { headers }));
    if (resp.status === 401) {
      const k = prompt("This app needs an API key:");
      if (!k) throw new Error("An API key is required.");
      store.set("key", k.trim());
      return call(url, opts);
    }
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok && resp.status !== 202) throw new Error(data.error || "The server returned " + resp.status + ".");
    return data;
  }
  function card(title) {
    const c = el("div", "card"), h = el("h2"), st = el("span", "state", "queued");
    h.append(el("span", "", title), st);
    const meta = el("div", "meta"), body = el("div");
    c.append(h, meta, body);
    $("results").prepend(c);
    return { st, meta, body };
  }
  function show(ui, v) {
    let state = v.state;
    if (state === "done") state = v.approved ? "approved" : "not approved";
    ui.st.textContent = state; ui.st.className = "state " + (v.approved ? "done" : v.state);
    ui.body.textContent = "";
    if (v.error) ui.body.append(el("div", "err", v.error));
    const bits = [];
    if (v.round) bits.push("round " + v.round);
    if (v.state === "waiting") { const a = el("a", "", "review it"); a.href = "_approvals/"; ui.meta.textContent = bits.join(" · ") + " · waiting for a reviewer — "; ui.meta.append(a); }
    else ui.meta.textContent = bits.join(" · ") + (v.state === "running" || v.state === "queued" ? (bits.length ? " · " : "") + "writing…" : "");
    const text = v.content || v.draft;
    if (text) ui.body.append(el("div", "draft", text));
    for (const r of v.reviews || []) ui.body.append(el("div", "meta", "Round " + r.round + ": " + r.state + (r.by ? " by " + r.by : "") + (r.comment ? " — " + r.comment : "")));
  }
  async function follow(ui, id) {
    for (;;) {
      const v = await call("drafts?id=" + encodeURIComponent(id));
      show(ui, v);
      if (v.state === "done" || v.state === "dead" || v.state === "canceled") return;
      await new Promise((r) => setTimeout(r, v.state === "waiting" ? 5000 : 1500));
    }
  }
  $("go").addEventListener("click", async () => {
    const brief = $("brief").value.trim();
    if (!brief) return;
    const ui = card(brief.length > 60 ? brief.slice(0, 60) + "…" : brief);
    try {
      const job = await call("drafts", { method: "POST", body: JSON.stringify({
        brief, kind: $("kind").value, audience: $("audience").value, tone: $("tone").value, words: Number($("words").value) || 400 }) });
      await follow(ui, job.job);
    } catch (err) {
      ui.st.textContent = "error"; ui.st.className = "state error"; ui.body.textContent = "";
      ui.body.append(el("div", "err", err.message));
    }
  });
})();
</script>
</body>
</html>
