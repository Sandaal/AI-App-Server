<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #2f6feb; --user: #e8f0fe; --error: #b42318; --chip: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8d96a0; --border: #30363d;
      --accent: #4c8dff; --user: #1c2b45; --error: #ff7b72; --chip: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 820px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 18px 0; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .bot.error { color: var(--error); }
  .cite { color: var(--accent); font-weight: 600; font-size: 12px; vertical-align: super; }
  .sources { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); display: flex; flex-wrap: wrap; gap: 6px; white-space: normal; }
  .sources span { background: var(--chip); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .empty { color: var(--muted); text-align: center; margin: auto; }
  form { display: flex; gap: 8px; padding: 12px 0 18px; border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Chat</h1>
    <button id="reset" type="button" title="Start a new conversation">New chat</button>
  </header>
  <div id="log" aria-live="polite"><p class="empty" id="empty">Ask a question about your documents.</p></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" aria-label="Message" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
(() => {
  "use strict";
  const app = location.pathname.split("/")[2] || "app";
  const store = {
    get(k) { try { return localStorage.getItem(app + ":" + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(app + ":" + k, v); } catch {} },
    del(k) { try { localStorage.removeItem(app + ":" + k); } catch {} },
  };
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send");
  document.title = $("title").textContent = app;

  const newSession = () => {
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[^a-zA-Z0-9-]/g, "");
    store.set("session", id);
    return id;
  };
  let session = store.get("session") || newSession();

  function bubble(cls, text) {
    $("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // Render answer text with [n] citation markers as styled spans (text only, never HTML).
  function renderAnswer(el, text) {
    el.textContent = "";
    for (const part of text.split(/(\[\d+\])/)) {
      if (/^\[\d+\]$/.test(part)) {
        const s = document.createElement("span");
        s.className = "cite";
        s.textContent = part;
        el.appendChild(s);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    }
  }

  function renderSources(el, text, citations) {
    if (!citations || !citations.length) return;
    const used = citations.filter((c) => text.includes("[" + c.n + "]"));
    const shown = used.length ? used : citations;
    const box = document.createElement("div");
    box.className = "sources";
    for (const c of shown) {
      const chip = document.createElement("span");
      chip.textContent = "[" + c.n + "] " + c.source + (c.page ? ", p. " + c.page : "");
      box.appendChild(chip);
    }
    el.appendChild(box);
  }

  // Parse a fetch() body as Server-Sent Events.
  async function* events(body) {
    const reader = body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let event = "message";
        const data = [];
        for (const line of raw.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data.push(line.slice(line.startsWith("data: ") ? 6 : 5));
        }
        yield { event, data: data.join("\n") };
      }
    }
  }

  async function ask(question) {
    bubble("user", question);
    const el = bubble("bot", "…");
    send.disabled = true;
    let text = "";
    try {
      const headers = { "Content-Type": "application/json", "X-Session-Id": session };
      const key = store.get("key");
      if (key) headers["Authorization"] = "Bearer " + key;
      const resp = await fetch("chat", { method: "POST", headers, body: JSON.stringify({ message: question }) });
      if (resp.status === 401) {
        const k = prompt("This app needs an API key:");
        if (k) { store.set("key", k.trim()); el.remove(); log.lastChild?.remove(); return ask(question); }
        throw new Error("An API key is required.");
      }
      if (resp.status === 429) throw new Error("Too many requests. Wait a moment and try again.");
      if (!resp.ok) {
        let msg = "";
        try { msg = (await resp.json()).message || ""; } catch {}
        if (msg) throw new Error(msg);
      }
      if (!resp.ok || !resp.body) throw new Error("The server returned " + resp.status + ".");
      for await (const ev of events(resp.body)) {
        if (ev.event === "message") {
          text += ev.data;
          renderAnswer(el, text);
          log.scrollTop = log.scrollHeight;
        } else if (ev.event === "replace") {
          text = ev.data; // a guardrail changed or withheld the answer
          renderAnswer(el, text);
        } else if (ev.event === "end") {
          let meta = {};
          try { meta = JSON.parse(ev.data || "{}"); } catch {}
          renderAnswer(el, text);
          renderSources(el, text, meta.citations);
        } else if (ev.event === "error") {
          throw new Error(text ? "The answer was cut off." : "Something went wrong. Please try again.");
        }
      }
    } catch (err) {
      if (!text) el.textContent = "";
      el.classList.add("error");
      el.appendChild(document.createTextNode((text ? "\n\n" : "") + err.message));
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || send.disabled) return;
    input.value = "";
    input.style.height = "";
    ask(q);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
  });
  input.addEventListener("input", () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; });
  $("reset").addEventListener("click", () => {
    session = newSession();
    log.textContent = "";
    const p = document.createElement("p");
    p.className = "empty"; p.id = "empty"; p.textContent = "Ask a question about your documents.";
    log.appendChild(p);
    input.focus();
  });
  input.focus();
})();
</script>
</body>
</html>
