<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #2f6feb; --ok: #1a7f37; --bad: #cf222e; --chip: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8d96a0; --border: #30363d;
      --accent: #4c8dff; --ok: #3fb950; --bad: #ff7b72; --chip: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { margin-top: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--chip); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin: 10px 0; }
  textarea { width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; resize: vertical; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button { border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; color: #fff; }
  button.approve { background: var(--ok); } button.reject { background: var(--bad); }
  button.plain { background: none; color: var(--accent); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  .done { color: var(--muted); font-weight: 600; }
  .error { color: var(--bad); }
  .empty { margin-top: 30px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Approvals</h1>
    <div><span class="muted" id="who"></span> <button class="plain" id="refresh" type="button">Refresh</button></div>
  </header>
  <div id="list"></div>
</main>
<script>
(() => {
  "use strict";
  const app = location.pathname.split("/")[2] || "app";
  const $ = (id) => document.getElementById(id);
  document.title = $("title").textContent = "Approvals · " + app;
  const store = {
    get(k) { try { return localStorage.getItem(app + ":" + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(app + ":" + k, v); } catch {} },
    del(k) { try { localStorage.removeItem(app + ":" + k); } catch {} },
  };
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  async function call(path, opts = {}) {
    let key = store.get("approver-key");
    if (!key) {
      key = (prompt("Approver API key for " + app + ":") || "").trim();
      if (!key) throw new Error("An approver API key is required (aiapp key create " + app + " --role approver).");
      store.set("approver-key", key);
    }
    const headers = Object.assign({ "Authorization": "Bearer " + key }, opts.headers);
    const resp = await fetch("_approvals/" + path, Object.assign({}, opts, { headers }));
    const data = await resp.json().catch(() => ({}));
    if (resp.status === 401 || resp.status === 403) {
      store.del("approver-key");
      throw new Error(data.error || "That key cannot decide approvals.");
    }
    if (!resp.ok) throw new Error(data.error || "The server returned " + resp.status + ".");
    return data;
  }

  function render(items, you) {
    const list = $("list");
    list.textContent = "";
    $("who").textContent = you ? "signed in as " + you : "";
    if (!items.length) { list.append(el("p", "empty", "Nothing is waiting for approval.")); return; }
    for (const a of items) {
      const card = el("div", "card");
      card.append(el("h2", "", a.title || a.key));
      const exp = new Date(a.expires_at);
      card.append(el("div", "muted", "Requested " + new Date(a.created_at).toLocaleString() + " · expires " + exp.toLocaleString()));
      if (a.details !== undefined && a.details !== null) card.append(el("pre", "", JSON.stringify(a.details, null, 2)));
      const comment = el("textarea");
      comment.placeholder = "Comment (optional)";
      comment.setAttribute("aria-label", "Comment");
      const actions = el("div", "actions");
      const status = el("div");
      const ok = el("button", "approve", "Approve");
      const no = el("button", "reject", "Reject");
      ok.type = no.type = "button";
      const decide = async (approve) => {
        ok.disabled = no.disabled = true;
        status.className = ""; status.textContent = "";
        try {
          const r = await call("decide", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: a.id, approve, comment: comment.value.trim() }) });
          actions.remove(); comment.remove();
          status.className = "done";
          status.textContent = r.state === "expired" ? "This approval had expired." : (r.state === "approved" ? "Approved" : "Rejected") + " by " + r.by + ".";
        } catch (err) {
          ok.disabled = no.disabled = false;
          status.className = "error"; status.textContent = err.message;
        }
      };
      ok.addEventListener("click", () => decide(true));
      no.addEventListener("click", () => decide(false));
      actions.append(ok, no);
      card.append(comment, actions, status);
      list.append(card);
    }
  }

  async function load() {
    try {
      const data = await call("pending");
      render(data.approvals || [], data.you);
    } catch (err) {
      const list = $("list");
      list.textContent = "";
      list.append(el("p", "empty error", err.message));
    }
  }
  $("refresh").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
